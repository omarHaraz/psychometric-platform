<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Arab Experts Institute</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />

    <style>
        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
        }
        .font-display { font-family: 'Cairo', 'Plus Jakarta Sans', sans-serif; }
        .font-mono-label { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; letter-spacing: 0.04em; }
    </style>
</head>

<body class="min-h-screen flex flex-col justify-between selection:bg-[#1b3879]/20">

    <!-- Top Header -->
    <header class="w-full px-6 py-5 flex justify-between items-center max-w-[1440px] mx-auto">
        <a href="../index.html" class="flex items-center gap-3">
            <img src="assets/images/logo.png" alt="Arab Experts Institute For Training & Consultation" class="h-10 md:h-12 w-auto object-contain" />
        </a>
        <a href="../index.html" class="font-body text-xs font-semibold text-[#1b3879] hover:underline flex items-center gap-1">
            <span>Home Portal</span>
            <span class="material-symbols-outlined text-sm">arrow_forward</span>
        </a>
    </header>

    <!-- Center Login Card -->
    <main class="flex-grow flex items-center justify-center p-6">
        <div class="w-full max-w-md bg-white rounded-3xl p-8 md:p-10 shadow-2xl border border-slate-200/80 space-y-6">
            <div class="text-center space-y-2">
                <div class="w-12 h-12 rounded-full bg-[#1b3879]/10 text-[#1b3879] flex items-center justify-center mx-auto mb-3">
                    <span class="material-symbols-outlined text-2xl">lock</span>
                </div>
                <span class="font-mono-label text-[11px] uppercase tracking-widest text-[#1b3879] font-bold">Welcome Back</span>
                <h1 class="font-display font-extrabold text-3xl text-[#1c1c19]">Sign In</h1>
                <p class="font-body text-xs text-[#64748b]">Sign in to access your assessment tests and account dashboard.</p>
            </div>

            <form id="loginForm" novalidate class="space-y-4">
                <div class="form-error bg-red-50 border border-red-200 text-red-700 text-xs p-3 rounded-xl hidden" id="formError" role="alert"></div>

                <!-- Email -->
                <div class="space-y-1">
                    <label for="email" class="font-mono-label text-xs uppercase tracking-wider text-[#3e4948] font-bold">Email Address *</label>
                    <div class="relative">
                        <input type="email" id="email" name="email" placeholder="user@arabexperts.com" required class="w-full p-3.5 rounded-xl border border-slate-300 text-xs font-body outline-none focus:border-[#1b3879] transition-colors" />
                    </div>
                    <span class="text-[11px] text-red-500 font-mono-label" id="emailError"></span>
                </div>

                <!-- Password -->
                <div class="space-y-1">
                    <label for="password" class="font-mono-label text-xs uppercase tracking-wider text-[#3e4948] font-bold">Password *</label>
                    <div class="relative flex items-center">
                        <input type="password" id="password" name="password" placeholder="••••••••" required class="w-full p-3.5 rounded-xl border border-slate-300 text-xs font-body outline-none focus:border-[#1b3879] transition-colors pr-10" />
                        <button type="button" class="absolute right-3 text-[#64748b] hover:text-[#1b3879]" id="togglePassword" aria-label="Show password">
                            <span class="material-symbols-outlined text-base">visibility</span>
                        </button>
                    </div>
                    <span class="text-[11px] text-red-500 font-mono-label" id="passwordError"></span>
                </div>

                <div class="flex justify-end pt-1">
                    <a href="forgot-password.html" class="text-xs text-[#1b3879] hover:underline font-body font-medium">Forgot password?</a>
                </div>

                <button type="submit" class="w-full bg-[#1b3879] hover:bg-[#152c61] text-white py-3.5 rounded-xl font-body font-semibold text-sm shadow-xl hover:shadow-2xl transition-all">
                    Sign In
                </button>
            </form>

            <div class="text-center pt-2 border-t border-slate-100">
                <p class="text-xs text-[#64748b]">
                    Don't have an account?
                    <a href="signup.html" class="text-[#1b3879] font-bold hover:underline">Create Account</a>
                </p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-4 text-center text-xs text-[#64748b] font-mono-label">
        &copy; 2026 Arab Experts Institute For Training & Consultation. All rights reserved.
    </footer>

    <script type="module" src="js/login.js"></script>
</body>
</html>
