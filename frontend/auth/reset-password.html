<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Password | Sand & Sea Coastal Lifestyle</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=JetBrains+Mono:wght@500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #fcf9f4;
            color: #1c1c19;
        }
        .font-display { font-family: 'Bricolage Grotesque', sans-serif; }
        .font-mono-label { font-family: 'JetBrains Mono', monospace; }
    </style>
</head>

<body class="min-h-screen flex flex-col justify-between selection:bg-[#006764]/20">

    <!-- Top Header -->
    <header class="w-full px-6 py-5 flex justify-between items-center max-w-[1440px] mx-auto">
        <a href="../customer/index.html" class="font-display font-bold text-2xl text-[#1c1c19] flex items-center gap-2">
            <span class="material-symbols-outlined text-[#006764]">water</span>
            <span>Sand & Sea</span>
        </a>
        <a href="../customer/index.html" class="font-body text-xs font-semibold text-[#006764] hover:underline flex items-center gap-1">
            <span>Back to Storefront</span>
            <span class="material-symbols-outlined text-sm">arrow_forward</span>
        </a>
    </header>

    <!-- Center Card -->
    <main class="flex-grow flex items-center justify-center p-6">
        <div class="w-full max-w-md bg-white rounded-3xl p-8 md:p-10 shadow-2xl border border-[#bdc9c7]/40 space-y-6">
            <div class="text-center space-y-2">
                <div class="w-12 h-12 rounded-full bg-[#006764]/10 text-[#006764] flex items-center justify-center mx-auto mb-3">
                    <span class="material-symbols-outlined text-2xl">lock_reset</span>
                </div>
                <span class="font-mono-label text-[11px] uppercase tracking-widest text-[#006764] font-bold">New Security Password</span>
                <h1 class="font-display font-extrabold text-3xl text-[#1c1c19]">Create New Password</h1>
                <p class="font-body text-xs text-[#6e7978]">Your new password must be different from your previous password.</p>
            </div>

            <form id="resetPasswordForm" class="space-y-4">
                <div class="form-error bg-red-50 border border-red-200 text-red-700 text-xs p-3 rounded-xl hidden" id="formError" role="alert"></div>

                <!-- Password -->
                <div class="space-y-1">
                    <label for="password" class="font-mono-label text-xs uppercase tracking-wider text-[#3e4948] font-bold">New Password *</label>
                    <div class="relative flex items-center">
                        <input type="password" id="password" placeholder="••••••••" autocomplete="new-password" required class="w-full p-3.5 rounded-xl border border-[#bdc9c7]/60 text-xs font-body outline-none focus:border-[#006764] transition-colors pr-10" />
                        <button type="button" id="togglePassword" class="absolute right-3 text-[#6e7978] hover:text-[#006764]" aria-label="Show password">
                            <span class="material-symbols-outlined text-base">visibility</span>
                        </button>
                    </div>
                    <span class="text-[11px] text-red-500 font-mono-label" id="passwordError"></span>
                </div>

                <!-- Confirm Password -->
                <div class="space-y-1">
                    <label for="confirmPassword" class="font-mono-label text-xs uppercase tracking-wider text-[#3e4948] font-bold">Confirm Password *</label>
                    <div class="relative flex items-center">
                        <input type="password" id="confirmPassword" placeholder="••••••••" autocomplete="new-password" required class="w-full p-3.5 rounded-xl border border-[#bdc9c7]/60 text-xs font-body outline-none focus:border-[#006764] transition-colors pr-10" />
                        <button type="button" id="toggleConfirmPassword" class="absolute right-3 text-[#6e7978] hover:text-[#006764]" aria-label="Show password">
                            <span class="material-symbols-outlined text-base">visibility</span>
                        </button>
                    </div>
                    <span class="text-[11px] text-red-500 font-mono-label" id="confirmPasswordError"></span>
                </div>

                <button type="submit" class="w-full bg-[#006764] hover:bg-[#20817d] text-white py-3.5 rounded-xl font-body font-semibold text-sm shadow-xl hover:shadow-2xl transition-all">
                    Reset Password
                </button>
            </form>

            <div class="text-center pt-2 border-t border-[#f0ede9]">
                <p class="text-xs text-[#6e7978]">
                    Remember your password?
                    <a href="login.html" class="text-[#006764] font-bold hover:underline">Sign In</a>
                </p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-4 text-center text-xs text-[#6e7978] font-mono-label">
        &copy; 2026 Sand & Sea Coastal Lifestyle. All rights reserved.
    </footer>

    <script type="module" src="js/reset-password.js"></script>
</body>
</html>
