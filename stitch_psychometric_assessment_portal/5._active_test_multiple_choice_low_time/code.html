<script>
        // Simple radio button interaction logic for visual fidelity
        document.querySelectorAll('input[type="radio"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                // Reset all
                document.querySelectorAll('label').forEach(label => {
                    label.classList.remove('border-primary', 'bg-primary-container/5', 'shadow-[0_0_0_1px_rgba(0,104,95,0.1)]', 'border-2');
                    label.classList.add('border-[#E2E8F0]', 'border');
                    const innerDot = label.querySelector('.bg-primary');
                    if(innerDot) innerDot.classList.replace('opacity-100', 'opacity-0');
                    const outerRing = label.querySelector('.rounded-full.border-2');
                    if(outerRing) {
                        outerRing.classList.remove('border-primary');
                        outerRing.classList.add('border-outline');
                    }
                });

                // Set active
                if(e.target.checked) {
                    const label = e.target.closest('label');
                    label.classList.remove('border-[#E2E8F0]', 'border');
                    label.classList.add('border-primary', 'bg-primary-container/5', 'shadow-[0_0_0_1px_rgba(0,104,95,0.1)]', 'border-2');
                    const innerDot = label.querySelector('.bg-primary');
                    if(innerDot) innerDot.classList.replace('opacity-0', 'opacity-100');
                    const outerRing = label.querySelector('.rounded-full.border-2');
                    if(outerRing) {
                        outerRing.classList.remove('border-outline');
                        outerRing.classList.add('border-primary');
                    }
                }
            });
        });
    </script>
