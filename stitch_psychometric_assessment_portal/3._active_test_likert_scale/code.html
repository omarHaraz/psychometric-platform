                    <span class="material-symbols-outlined" style="font-size: 18px;">arrow_forward</span>

<script>
        document.addEventListener('DOMContentLoaded', () => {
            const likertBtns = document.querySelectorAll('.likert-btn');
            const nextBtn = document.getElementById('next-btn');

            likertBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    // Reset all buttons
                    likertBtns.forEach(b => {
                        b.classList.remove('active', 'border-primary');
                        b.classList.add('border-outline-variant');
                        const indicator = b.querySelector('.indicator');
                        indicator.innerHTML = '';
                        indicator.classList.remove('border-on-primary-container', 'bg-on-primary-container');
                        indicator.classList.add('border-outline');
                        b.querySelector('span:not(.indicator)').classList.remove('text-on-primary-container');
                        b.querySelector('span:not(.indicator)').classList.add('text-on-surface');
                    });

                    // Set active button
                    btn.classList.add('active', 'border-primary');
                    btn.classList.remove('border-outline-variant');
                    
                    const activeIndicator = btn.querySelector('.indicator');
                    activeIndicator.classList.remove('border-outline');
                    activeIndicator.classList.add('border-on-primary-container', 'bg-on-primary-container');
                    activeIndicator.innerHTML = '<span class="material-symbols-outlined text-primary" style="font-size: 16px; font-weight: bold;">check</span>';
                    
                    btn.querySelector('span:not(.indicator)').classList.remove('text-on-surface');
                    btn.querySelector('span:not(.indicator)').classList.add('text-on-primary-container');

                    // Show next button
                    nextBtn.classList.remove('opacity-0', 'pointer-events-none');
                });
            });
        });
    </script>
