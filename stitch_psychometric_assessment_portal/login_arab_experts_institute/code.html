<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Arab Experts Institute - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">

        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {

                      "outline": "#6d7a77",

                      "on-error": "#ffffff",
                      "inverse-surface": "#283044",
                      "background": "#faf8ff",

                      "primary-fixed-dim": "#6bd8cb",
                      "secondary": "#515f74",
                      "on-secondary-fixed-variant": "#3a485c",
                      "tertiary-fixed-dim": "#c3c7cb",
                      "on-tertiary": "#ffffff",
                      "inverse-primary": "#6bd8cb",
                      "surface-dim": "#d2d9f4",
                      "on-primary-fixed": "#00201d",
                      "on-surface": "#131b2e",
                      "surface-bright": "#faf8ff",
                      "on-primary-fixed-variant": "#005049",
                      "surface-tint": "#006a61",
                      "on-tertiary-fixed": "#171c1f",
                      "on-primary-container": "#f4fffc",
                      "surface-container": "#eaedff",
                      "on-tertiary-fixed-variant": "#43474b",
                      "outline-variant": "#bcc9c6",
                      "secondary-fixed": "#d5e3fd",
                      "surface-variant": "#dae2fd",
                      "primary-container": "#008378",
                      "surface-container-lowest": "#ffffff",
                      "on-secondary-fixed": "#0d1c2f",
                      "on-error-container": "#93000a",
                      "error-container": "#ffdad6",
                      "on-secondary-container": "#57657b",
                      "tertiary": "#585d60",
                      "on-primary": "#ffffff",
                      "surface-container-low": "#f2f3ff",
                      "error": "#ba1a1a",
                      "surface-container-highest": "#dae2fd"
              },
              "borderRadius": {
                      "DEFAULT": "0.125rem",
                      "lg": "0.25rem",
                      "xl": "0.5rem",
                      "full": "0.75rem"
              },
              "spacing": {
                      "md": "16px",
                      "sm": "8px",
                      "container-max": "1024px",
                      "base": "4px",
                      "gutter": "24px",
                      "xl": "40px",
                      "xs": "4px",
                      "lg": "24px"
              },
              "fontFamily": {
                      "headline-md": ["Inter"],
                      "headline-lg": ["Inter"],
                      "body-md": ["Inter"],
                      "body-lg": ["Inter"],
                      "label-md": ["Inter"],
                      "headline-lg-mobile": ["Inter"]
              },
              "fontSize": {
                      "headline-md": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                      "headline-lg": ["30px", {"lineHeight": "38px", "letterSpacing": "-0.02em", "fontWeight": "600"}],

                      "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],

                      "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "600"}]
              }
            }
          }
        }

<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F8FAFC; /* Level 1 Sub-surface as per design system */
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .input-field {
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .input-field:focus {
            border-color: #00685f; /* Teal focus */
            box-shadow: 0 0 0 1px #00685f;
            outline: none;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-md md:p-xl text-on-surface">
<main class="w-full max-w-[440px] mx-auto flex flex-col items-center">
<!-- Header / Logo Area -->
<div class="mb-8 flex flex-col items-center text-center w-full">
<img alt="Arab Experts Institute Logo" class="h-24 object-contain mb-6" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC3xwRP6lytzPj_xun9rHl2ZbN6ZB_hQ_amykk_uSTHzxtr63KS1l4GCTJFwWtEoJ3B7BzpWrJVqav2sTgztX56n9hWhCqCwc9g6EBhCgvDar71v_0XGeVUldo9KmjXGgBhDu-0U5x-Qv65UXU9o4r8oiqRLxUtqOYmRgj5kh7A-arv7UT0x4MdENxjCf2xCZFa_iFseIXMtSlZuSOZkOsCH74QKL7r4FwhKNxPcnuFAUijWtwXf3Q5">
<h1 class="font-headline-lg text-headline-lg hidden md:block text-on-surface">Assessment Portal</h1>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:hidden text-on-surface">Assessment Portal</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-2">Secure Candidate Login</p>
</div>
<!-- Login Card -->
<div class="bg-surface w-full rounded-xl border border-slate-200 p-lg shadow-sm">
<form action="#" class="space-y-6" method="POST">
<!-- ID/Email Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="candidate-id">Candidate ID / Email</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant text-opacity-70 text-[20px]">person</span>
</div>
<input class="input-field block w-full pl-10 pr-3 py-3 border border-outline-variant rounded bg-surface text-on-surface placeholder-on-surface-variant font-body-md text-body-md" id="candidate-id" name="candidate-id" placeholder="Enter your ID or email" required="" type="text">
</div>
</div>
<!-- Password Field -->
<div>
<div class="flex justify-between items-center mb-2">
<label class="block font-label-md text-label-md text-on-surface" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant text-opacity-70 text-[20px]">lock</span>
</div>
<input class="input-field block w-full pl-10 pr-10 py-3 border border-outline-variant rounded bg-surface text-on-surface placeholder-on-surface-variant font-body-md text-body-md" id="password" name="password" placeholder="••••••••" required="" type="password">
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-on-surface-variant hover:text-on-surface focus:outline-none" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<!-- Alert/Instruction Block (Optional/Example of the pattern) -->
<div class="bg-surface-container-low border-l-4 border-primary p-3 rounded-r text-sm flex items-start space-x-3 mt-4 hidden">
<span class="material-symbols-outlined text-primary text-[20px] shrink-0">info</span>
<p class="font-body-md text-body-md text-on-surface-variant text-sm">Please ensure you are in a quiet environment before starting your assessment.</p>
</div>
<!-- Login Button -->
<button class="w-full flex justify-center py-3 px-4 border border-transparent rounded bg-primary text-on-primary font-label-md text-label-md hover:bg-primary-container focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors mt-8" type="submit">
                    Login
                </button>
</form>
</div>
<!-- Registration Link -->
<div class="mt-8 text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                Don't have an account? 
                <a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors ml-1 font-semibold" href="#">Register here</a>
</p>
</div>
<!-- Footer / Security Note -->
<div class="mt-12 flex items-center justify-center space-x-2 text-on-surface-variant opacity-60">
<span class="material-symbols-outlined text-[16px]">shield</span>
<span class="font-label-md text-label-md text-xs">Secure Institutional Gateway</span>
</div>
</main>


</body></html>
