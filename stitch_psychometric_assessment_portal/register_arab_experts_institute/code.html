<!DOCTYPE html><html dir="ltr" lang="en"><head>

        body {
            background-color: #F8FAFC; /* Level 1 (Sub-surface) */
        }
    </style>

<body class="font-body-md text-body-md text-on-surface antialiased min-h-screen flex flex-col justify-center py-12 sm:px-6 lg:px-8">
<div class="sm:mx-auto sm:w-full sm:max-w-md">
<img alt="Arab Experts Institute Logo" class="mx-auto h-24 w-auto mb-8" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC3xwRP6lytzPj_xun9rHl2ZbN6ZB_hQ_amykk_uSTHzxtr63KS1l4GCTJFwWtEoJ3B7BzpWrJVqav2sTgztX56n9hWhCqCwc9g6EBhCgvDar71v_0XGeVUldo9KmjXGgBhDu-0U5x-Qv65UXU9o4r8oiqRLxUtqOYmRgj5kh7A-arv7UT0x4MdENxjCf2xCZFa_iFseIXMtSlZuSOZkOsCH74QKL7r4FwhKNxPcnuFAUijWtwXf3Q5">
<h2 class="mt-6 text-center font-headline-lg text-headline-lg text-on-background md:hidden font-headline-lg-mobile text-headline-lg-mobile">
            Register for Assessment
        </h2>
<h2 class="mt-6 text-center font-headline-lg text-headline-lg text-on-background hidden md:block">
            Register for Assessment
        </h2>
<p class="mt-2 text-center font-body-md text-body-md text-on-surface-variant">
            Please enter your details to create an account.
        </p>
</div>
<div class="mt-8 sm:mx-auto sm:w-full sm:max-w-[32rem]">
<div class="bg-surface py-8 px-4 border border-[#E2E8F0] shadow-[0_4px_12px_rgba(15,23,42,0.08)] sm:rounded-lg sm:px-10">
<form action="#" class="space-y-6" method="POST">
<!-- Full Name -->
<div>
<label class="block font-label-md text-label-md text-on-surface" for="fullName">Full Name</label>
<div class="mt-1 relative rounded-md shadow-sm">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">person</span>
</div>
<input class="focus:ring-primary focus:border-primary block w-full pl-10 sm:text-sm border-outline-variant rounded-md bg-surface" id="fullName" name="fullName" placeholder="John Doe" required="" type="text">
</div>
</div>
<!-- Candidate ID / National ID -->
<div>
<label class="block font-label-md text-label-md text-on-surface" for="candidateId">Candidate ID / National ID</label>
<div class="mt-1 relative rounded-md shadow-sm">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">badge</span>
</div>
<input class="focus:ring-primary focus:border-primary block w-full pl-10 sm:text-sm border-outline-variant rounded-md bg-surface" id="candidateId" name="candidateId" placeholder="e.g. 123456789" required="" type="text">
</div>
</div>
<!-- Email Address -->
<div>
<label class="block font-label-md text-label-md text-on-surface" for="email">Email Address</label>
<div class="mt-1 relative rounded-md shadow-sm">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">mail</span>
</div>
<input class="focus:ring-primary focus:border-primary block w-full pl-10 sm:text-sm border-outline-variant rounded-md bg-surface" id="email" name="email" placeholder="you@example.com" required="" type="email">
</div>
</div>
<!-- Password -->
<div>
<label class="block font-label-md text-label-md text-on-surface" for="password">Create Password</label>
<div class="mt-1 relative rounded-md shadow-sm">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">lock</span>
</div>
<input class="focus:ring-primary focus:border-primary block w-full pl-10 sm:text-sm border-outline-variant rounded-md bg-surface" id="password" name="password" placeholder="••••••••" required="" type="password">
</div>
</div>
<!-- Confirm Password -->
<div>
<label class="block font-label-md text-label-md text-on-surface" for="confirmPassword">Confirm Password</label>
<div class="mt-1 relative rounded-md shadow-sm">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">swipe_left_alt</span>
</div>
<input class="focus:ring-primary focus:border-primary block w-full pl-10 sm:text-sm border-outline-variant rounded-md bg-surface" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required="" type="password">
</div>
</div>
<!-- Terms and Privacy -->
<div class="flex items-center">
<input class="h-4 w-4 text-primary focus:ring-primary border-outline-variant rounded" id="terms" name="terms" required="" type="checkbox">
<label class="ml-2 block font-body-md text-body-md text-on-surface-variant" for="terms">
                        I agree to the <a class="text-primary hover:text-primary-container font-medium" href="#">Terms of Assessment</a> &amp; <a class="text-primary hover:text-primary-container font-medium" href="#">Privacy Policy</a>
</label>
</div>
<!-- Submit Button -->
<div>
<button class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm font-label-md text-label-md text-on-primary bg-primary hover:bg-primary-container focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors duration-200" type="submit">
                        Create Account
                    </button>
</div>
</form>
<div class="mt-6">
<div class="relative">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-2 bg-surface text-on-surface-variant font-body-md text-body-md">
                            Already have an account? <a class="font-medium text-primary hover:text-primary-container" href="#">Login here</a>
</span>
</div>
</div>
</div>
</div>
</div>


</body></html>
