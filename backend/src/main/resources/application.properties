# ===================================================================
# Application Core Configuration
# ===================================================================
spring.application.name=psychometric-platform
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
server.port=${PORT:8080}

# ===================================================================
# MySQL DataSource Configuration
# ===================================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/psychometric_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:springstudent}
spring.datasource.password=${DB_PASSWORD:springstudent}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# JPA / Hibernate Configuration
# ===================================================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.properties.hibernate.default_batch_fetch_size=20
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
logging.level.org.hibernate.SQL=${HIBERNATE_LOG_LEVEL:WARN}

# ===================================================================
# Redis Cache Configuration
# ===================================================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# ===================================================================
# JWT Authentication Security Configuration
# Safe placeholder default strictly for local dev/testing; provide production 256-bit+ secret via JWT_SECRET
# ===================================================================
jwt.secret=${JWT_SECRET:localDevDummySecretKeyMustBeAtLeast256BitsLongForHmacSha256Security1234567890}

# ===================================================================
# Spring Mail (SMTP) Configuration
# ===================================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQUIRED:true}
spring.mail.default-encoding=UTF-8

# ===================================================================
# CORS (Cross-Origin Resource Sharing)
# Supports live domain https://psychometricarab.com, api.psychometricarab.com, GitHub Pages, and local dev
# ===================================================================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://psychometricarab.com,https://www.psychometricarab.com,https://api.psychometricarab.com,https://omarharaz.github.io,http://127.0.0.1:5500,http://localhost:5500,http://localhost:3000,http://localhost:5173,http://localhost:8080,http://localhost:8081,http://localhost:8085}

# ===================================================================
# File Upload / Multipart Configuration
# ===================================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ===================================================================
# Cloudinary CDN Configuration
# ===================================================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.folder=${CLOUDINARY_FOLDER:psychometric}

# ===================================================================
# Scoring Validity Metrics & Penalty Configuration
# ===================================================================
psychometric.scoring.validity.central-tendency-cutoff-pct=${CENTRAL_TENDENCY_CUTOFF_PCT:45.0}
psychometric.scoring.validity.sd-penalty-threshold-pct=${SD_PENALTY_THRESHOLD_PCT:60.0}
psychometric.scoring.validity.sd-penalty-rate=${SD_PENALTY_RATE:0.15}
psychometric.scoring.validity.ct-penalty-threshold-pct=${CT_PENALTY_THRESHOLD_PCT:45.0}
psychometric.scoring.validity.ct-penalty-rate=${CT_PENALTY_RATE:0.15}
psychometric.scoring.validity.max-penalty-cap-pct=${MAX_PENALTY_CAP_PCT:15.0}

# ===================================================================
# Logging Configuration
# ===================================================================
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}

# ===================================================================
# Gemini AI API Configuration
# ===================================================================
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent}
gemini.api.key=${GEMINI_API_KEY:}
