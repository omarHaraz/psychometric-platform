<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${lang != null ? lang : 'ar'}" th:dir="${dir != null ? dir : 'rtl'}">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Page 8 - Competency Detail</title>
</head>
<body th:class="${dir != null ? dir : 'rtl'}">
    <div th:fragment="body" class="pdf-page-wrapper" style="padding: 10px; box-sizing: border-box; position: relative;">
        <!-- Page Header -->
        <div style="width: 100%; border-bottom: 2px solid #2A3686; padding-bottom: 10px; margin-bottom: 10px;">
            <table style="width: 100%; border-collapse: collapse; border: none; background: transparent;">
                <tr th:if="${dir == 'en' || dir == 'ltr'}">
                    <td style="text-align: left; vertical-align: bottom; width: 60%; border: none; padding: 0;">
                        <h1 style="margin: 0; font-family: 'Cairo', 'Arial', sans-serif; font-size: 22px; font-weight: 800; color: #2A3686; line-height: 1.2;" th:text="${competencyPages[8].competencyTitle}">Competency</h1>
                    </td>
                    <td style="text-align: right; vertical-align: bottom; width: 40%; border: none; padding: 0;">
                        <span style="font-family: 'Cairo', 'Arial', sans-serif; font-weight: bold; color: #2A3686; font-size: 11px;" th:text="#{report.common.page} + ' 8'">Page 8</span>
                    </td>
                </tr>
                <tr th:if="${dir == 'rtl' || dir == null}">
                    <td style="text-align: left; vertical-align: bottom; width: 40%; border: none; padding: 0;">
                        <span style="font-family: 'Cairo', 'Amiri', sans-serif; font-weight: bold; color: #2A3686; font-size: 11px;" th:text="#{report.common.page} + ' 8'">صفحة 8</span>
                    </td>
                    <td style="text-align: right; vertical-align: bottom; width: 60%; border: none; padding: 0;">
                        <h1 style="margin: 0; font-family: 'Cairo', 'Amiri', sans-serif; font-size: 22px; font-weight: 800; color: #2A3686; line-height: 1.2;" th:text="${competencyPages[8].competencyTitle}">الكفاءة</h1>
                    </td>
                </tr>
            </table>
        </div>

        <th:block th:with="
            competencyTitle=${competencyPages[8].competencyTitle},
            competencyDesc=${competencyPages[8].competencyDesc},
            competencyScore=${competencyPages[8].competencyScore},
            competencyColor=${competencyPages[8].competencyColor},
            indicator1Color=${competencyPages[8].indicator1Color},
            req1=${competencyPages[8].req1},
            result1=${competencyPages[8].result1},
            rec1=${competencyPages[8].rec1},
            indicator2Color=${competencyPages[8].indicator2Color},
            req2=${competencyPages[8].req2},
            result2=${competencyPages[8].result2},
            rec2=${competencyPages[8].rec2},
            indicator3Color=${competencyPages[8].indicator3Color},
            req3=${competencyPages[8].req3},
            result3=${competencyPages[8].result3},
            rec3=${competencyPages[8].rec3}
        ">
            <div th:insert="~{report/competency-detail :: body}"></div>
        </th:block>
    </div>
</body>
</html>
