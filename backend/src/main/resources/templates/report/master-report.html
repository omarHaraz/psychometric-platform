<!DOCTYPE html>

    <!-- Arabic Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />

    <style>
        /* ==========================================================================
           Master Print & PDF Multi-page Configuration (openhtmltopdf & Flying Saucer)
           ========================================================================== */
        @page {
            size: A4 portrait;
            margin: 0;
        }

        * {
            box-sizing: border-box;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        html, body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            font-family: 'Cairo', 'Amiri', 'DejaVu Sans', 'Arial', sans-serif;
            direction: rtl;
            text-align: right;
        }

        .pdf-page-container {
            width: 210mm;
            min-height: 297mm;
            max-height: 297mm;
            height: 297mm;
            position: relative;
            page-break-inside: avoid;
            page-break-after: always;
            overflow: hidden;
            background-color: #ffffff;
            margin: 0 auto;
        }

        .pdf-page-container:last-child {
            page-break-after: auto;
        }
    </style>
</head>
