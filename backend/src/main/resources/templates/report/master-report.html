        @page {

            margin: 0;

        * {
            box-sizing: border-box;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        html, body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            font-family: 'Cairo', 'Amiri', 'DejaVu Sans', 'Arial', sans-serif;
        }

        html[dir="rtl"], body[dir="rtl"], .rtl {
            direction: rtl;
            text-align: right;
        }

        html[dir="ltr"], body[dir="ltr"], .ltr {
            direction: ltr;
            text-align: left;
        }

        .pdf-page-wrapper {
            width: 210mm;
            min-height: 297mm;
            max-height: 297mm;
            height: 297mm;
            position: relative;
            page-break-inside: avoid;
            page-break-after: always;
            overflow: hidden;
            background-color: #ffffff;
            margin: 0 auto;
