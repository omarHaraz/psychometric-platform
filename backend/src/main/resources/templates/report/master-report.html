<!DOCTYPE html>
<html lang="ar" dir="rtl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>تقرير الكفاءات للقادة - التقرير الشامل</title>
    
    <!-- Native Local Arabic Fonts loaded via PdfGeneratorService (Cairo and Amiri) -->

    <!-- Aggregated Page Styles -->
    <th:block th:insert="~{report/cover-page :: style}"></th:block>
    <th:block th:insert="~{report/page2 :: style}"></th:block>
    <th:block th:insert="~{report/page3 :: style}"></th:block>
    <th:block th:insert="~{report/page4 :: style}"></th:block>
    <th:block th:insert="~{report/page5 :: style}"></th:block>
    <th:block th:insert="~{report/page6 :: style}"></th:block>
    <th:block th:insert="~{report/page7 :: style}"></th:block>
    <th:block th:insert="~{report/page15 :: style}"></th:block>

    <style>
        /* ==========================================================================
           Master Print &amp; PDF Multi-page Configuration (openhtmltopdf &amp; Flying Saucer)
           ========================================================================== */
        @page {
            size: A4 portrait;
            margin: 0;
        }

        * {
            box-sizing: border-box;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        html, body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            font-family: 'Cairo', 'Amiri', 'DejaVu Sans', 'Arial', sans-serif;
            direction: rtl;
            text-align: right;
        }

        .pdf-page-wrapper {
            width: 210mm;
            min-height: 297mm;
            max-height: 297mm;
            height: 297mm;
            position: relative;
            page-break-inside: avoid;
            page-break-after: always;
            overflow: hidden;
            background-color: #ffffff;
            margin: 0 auto;
        }

        .page-number-display::before {
            content: "صفحة " counter(page);
        }
    </style>
</head>
<body>

    <!-- Page 1: Cover Page -->
    <div class="pdf-page-wrapper" th:insert="~{report/cover-page :: body}"></div>

    <!-- Page 2: Introduction &amp; Impression Management -->
    <div class="pdf-page-wrapper" th:insert="~{report/page2 :: body}"></div>

    <!-- Page 3: Framework &amp; Methodology -->
    <div class="pdf-page-wrapper" th:insert="~{report/page3 :: body}"></div>

    <!-- Page 4: Results Summary – Personality Traits 1–10 -->
    <div class="pdf-page-wrapper" th:insert="~{report/page4 :: body}"></div>

    <!-- Page 5: Results Summary – Competencies &amp; General Abilities -->
    <div class="pdf-page-wrapper" th:insert="~{report/page5 :: body}"></div>

    <!-- Page 6: Section Divider / Transition -->

    <!-- Page 7: Communication &amp; Influence -->
    <div class="pdf-page-wrapper" th:insert="~{report/page7 :: body}"></div>

    <!-- Page 8: Initiative -->
    <div class="pdf-page-wrapper" th:insert="~{report/page8 :: body}"></div>

    <!-- Page 9: Decision Making &amp; Responsibility -->
    <div class="pdf-page-wrapper" th:insert="~{report/page9 :: body}"></div>

    <!-- Page 10: Inspiring Leadership -->
    <div class="pdf-page-wrapper" th:insert="~{report/page10 :: body}"></div>

    <!-- Page 11: Strategic Thinking -->
    <div class="pdf-page-wrapper" th:insert="~{report/page11 :: body}"></div>

    <!-- Page 12: Skill Development -->
    <div class="pdf-page-wrapper" th:insert="~{report/page12 :: body}"></div>

    <!-- Page 13: Adaptability -->
    <div class="pdf-page-wrapper" th:insert="~{report/page13 :: body}"></div>

    <!-- Page 14: Systematic Analysis &amp; Planning -->
    <div class="pdf-page-wrapper" th:insert="~{report/page14 :: body}"></div>

    <!-- Page 15: Development Plan – GROW Model -->
    <div class="pdf-page-wrapper" th:insert="~{report/page15 :: body}"></div>

</body>
</html>
