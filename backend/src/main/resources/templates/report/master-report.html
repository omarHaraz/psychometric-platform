    <style>
        /* ==========================================================================
           Master Print & PDF Multi-page Configuration (OpenHTMLtoPDF CSS Paged Media)
           ========================================================================== */
        @page {
            size: A4 portrait;
            margin: 25px 25px 75px 25px; /* Top, Right, Bottom (larger for footer), Left */

            @top-center {
                content: element(header);
            }
            @bottom-center {
                content: element(footer);
            }
        }

        * {
            box-sizing: border-box;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            font-family: 'Cairo', 'Amiri', 'DejaVu Sans', 'Inter', 'Arial', sans-serif;
            color: #404041;
        }

        /* Repeating Top Bar */
        div.header {
            position: running(header);
            height: 35px;
            background-color: #2A3686;
            color: #ffffff;
            padding: 0 20px;
            box-sizing: border-box;
        }

        /* Repeating Bottom Bar */
        div.footer {
            position: running(footer);
            height: 50px;
            border-top: 3px solid #2A3686;
            background-color: #ffffff;
            padding: 0 20px;
            box-sizing: border-box;
        }

        html[dir="rtl"], body[dir="rtl"], .rtl {
            direction: rtl;
            text-align: right;
        }

        html[dir="ltr"], body[dir="ltr"], .ltr {
            direction: ltr;
            text-align: left;
        }

        /* Hide redundant old bottom banners since repeating @bottom-center footer is used */
        .bottom-banner-container, .cover-footer, .banner-subtext, .page-footer-label {
            display: none !important;
        }

        .pdf-page-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
            page-break-inside: avoid;
            page-break-after: always;
            overflow: hidden;
            background-color: #ffffff;
            margin: 0 auto;
            box-sizing: border-box;
        }

        .pdf-page-wrapper:last-child {
            page-break-after: avoid;
        }

    </style>
</head>
