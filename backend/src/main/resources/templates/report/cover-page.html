<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Cover Page - تقرير الكفاءات للقادة</title>
    <style>
        /* ==========================================================================
           PDF & Print Optimization (Flying Saucer, OpenPDF, wkhtmltopdf compatible)
           ========================================================================== */
        @page {
            size: A4 portrait;
            margin: 0;
        }

        * {
            box-sizing: border-box;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 210mm;
            height: 297mm;
            min-height: 297mm;
            font-family: 'Cairo', 'Amiri', 'DejaVu Sans', 'Arial', 'Tahoma', sans-serif;
            background-color: #ffffff;
            color: #1e293b;
            text-align: center;
        }

        /* Outer Page Container */
        .page-container {
            position: relative;
            width: 210mm;
            height: 297mm;
            min-height: 297mm;
            overflow: hidden;
            background: #ffffff;
            margin: 0 auto;
        }

        /* Decorative Background Elements */
        .top-accent-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 10px;
            background: #00685f;
            z-index: 5;
        }

        .gold-accent-stripe {
            position: absolute;
            top: 10px;
            left: 0;
            right: 0;
            height: 4px;
            background: #c5a059;
            z-index: 5;
        }

        .geometric-accent-left {
            position: absolute;
            top: 0;
            left: 0;
            width: 140px;
            height: 140px;
            background: linear-gradient(135deg, rgba(0, 104, 95, 0.08) 0%, rgba(197, 160, 89, 0.03) 100%);
            border-bottom-right-radius: 100%;
            z-index: 1;
        }

        .geometric-accent-right {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 180px;
            height: 180px;
            background: linear-gradient(315deg, rgba(0, 104, 95, 0.07) 0%, rgba(197, 160, 89, 0.04) 100%);
            border-top-left-radius: 100%;
            z-index: 1;
        }

        /* Flexbox Centering Layout (Vertical & Horizontal) */
        .flex-center-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            width: 100%;
            height: 100%;
            min-height: 297mm;
            padding: 35mm 20mm 35mm 20mm;
            position: relative;
            z-index: 2;
        }

        /* 1. Header */
        .header-country {
            font-family: 'Inter', 'Arial', sans-serif;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: #475569;
            margin: 0 0 16px 0;
            direction: ltr;
            text-align: center;
        }

        .divider-small {
            width: 50px;
            height: 3px;
            background: #c5a059;
            margin: 0 auto 28px auto;
            border: none;
            border-radius: 2px;
        }

        /* 2. Report Title & Subtitle */
        .report-title-ar {
            font-size: 32px;
            font-weight: 800;
            color: #00685f;
            line-height: 1.35;
            margin: 0 0 10px 0;
            direction: rtl;
            text-align: center;
        }

        .report-subtitle-ar {
            font-size: 22px;
            font-weight: 600;
            color: #c5a059;
            margin: 0 0 35px 0;
            direction: rtl;
            text-align: center;
            letter-spacing: 1px;
        }

        /* 3. Candidate & Result Information Box */
        .meta-card {
            width: 380px;
            max-width: 90%;
            margin: 0 auto 30px auto;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-top: 3px solid #00685f;
            border-radius: 8px;
            padding: 18px 22px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.02);
        }

        .meta-line {
            font-size: 13px;
            color: #334155;
            margin: 0 0 8px 0;
            line-height: 1.5;
            text-align: center;
        }

        .meta-line.candidate-id {
            font-family: 'Inter', 'Arial', sans-serif;
            font-weight: 600;
            color: #0f172a;
            direction: ltr;
        }

        .meta-line.report-date {
            font-family: 'Inter', 'Arial', sans-serif;
            color: #64748b;
            font-size: 12px;
            direction: ltr;
        }

        .meta-line.result-score {
            font-family: 'Inter', 'Arial', sans-serif;
            font-size: 16px;
            font-weight: 700;
            color: #00685f;
            margin-top: 10px;
            margin-bottom: 0;
            padding-top: 8px;
            border-top: 1px dashed #cbd5e1;
            direction: ltr;
        }

        .meta-line.result-score span {
            font-size: 20px;
            color: #00685f;
        }

        /* 4. Company Name Section */
        .company-block {
            margin: 0 auto 20px auto;
            text-align: center;
        }

        .company-name-ar {
            font-size: 16px;
            font-weight: 700;
            color: #0f172a;
            line-height: 1.4;
            direction: rtl;
            margin: 0;
            text-align: center;
        }

        .company-sub-ar {
            font-size: 13px;
            font-weight: 600;
            color: #64748b;
            direction: rtl;
            margin: 2px 0 8px 0;
            text-align: center;
        }

        .company-name-en {
            font-family: 'Inter', 'Arial', sans-serif;
            font-size: 13px;
            font-weight: 700;
            color: #0f172a;
            direction: ltr;
            margin: 0;
            letter-spacing: 0.5px;
            text-align: center;
        }

        .company-sub-en {
            font-family: 'Inter', 'Arial', sans-serif;
            font-size: 11px;
            font-weight: 500;
            color: #64748b;
            direction: ltr;
            margin: 2px 0 0 0;
            text-align: center;
        }

        /* 5. Logo */
        .logo-container {
            margin: 10px auto 0 auto;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .company-logo {
            max-width: 140px;
            max-height: 65px;
            object-fit: contain;
            display: inline-block;
            margin: 0 auto;
        }

        /* 6. Footer */
        .page-footer {
            position: absolute;
            bottom: 12mm;
            left: 0;
            right: 0;
            width: 100%;
            text-align: center;
            padding: 0 20mm;
            box-sizing: border-box;
            z-index: 10;
        }

        .footer-divider {
            width: 80%;
            height: 1px;
            background: #e2e8f0;
            margin: 0 auto 10px auto;
            border: none;
        }

        .footer-text {
            font-size: 11px;
            color: #64748b;
            line-height: 1.4;
            text-align: center;
            direction: ltr;
        }

        .footer-text .cid {
            font-family: 'Inter', 'Arial', sans-serif;
            font-weight: 600;
            color: #334155;
        }

        .footer-text .ar-title {
            direction: rtl;
            display: inline-block;
        }

        .footer-bottom-accent {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: #00685f;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="page-container">
        <!-- Top Accents -->
        <div class="top-accent-bar"></div>
        <div class="gold-accent-stripe"></div>
        <div class="geometric-accent-left"></div>
        <div class="geometric-accent-right"></div>

        <!-- Flexbox Centered Content -->
        <div class="flex-center-container">
            
            <!-- 1. Header -->
            <div class="header-country" dir="ltr">UNITED ARAB EMIRATES</div>
            <hr class="divider-small" />

            <!-- 2. Report Title & Subtitle (Arabic RTL) -->
            <h1 class="report-title-ar" dir="rtl">تقرير الكفاءات للقادة</h1>
            <div class="report-subtitle-ar" dir="rtl">تطوير</div>

            <!-- 3. Candidate Info & Result Box (English LTR with variables) -->
            <div class="meta-card">
                <div class="meta-line candidate-id" dir="ltr">
                    candidateID <span th:text="${candidateId}">CAN-98234</span>
                </div>
                <div class="meta-line report-date" dir="ltr">
                    <span th:text="${reportDate}">2026-08-31</span>
                </div>
                <div class="meta-line result-score" dir="ltr">
                    Result: <span th:text="${resultScore}">88.5</span>%
                </div>
            </div>

            <!-- 4. Company Name (Arabic RTL & English LTR) -->
            <div class="company-block">
                <div class="company-name-ar" dir="rtl">معهد الخبراء العرب</div>
                <div class="company-sub-ar" dir="rtl">للتدريب والاستشارات</div>
                <div class="company-name-en" dir="ltr">Arab Experts Institute</div>
                <div class="company-sub-en" dir="ltr">For Training &amp; Consultation</div>
            </div>

            <!-- 5. Logo (Base64 data URI / Dynamic Thymeleaf URL / Fallback SVG) -->
            <div class="logo-container">
                <img class="company-logo" 
                     th:src="${companyLogoBase64 != null ? companyLogoBase64 : (logoUrl != null ? logoUrl : 'data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 240 70\'><rect width=\'240\' height=\'70\' rx=\'8\' fill=\'%23f1f5f9\'/><path d=\'M35 18 L50 48 L20 48 Z\' fill=\'%2300685f\'/><circle cx=\'35\' cy=\'38\' r=\'6\' fill=\'%23c5a059\'/><text x=\'62\' y=\'34\' font-family=\'Arial\' font-size=\'14\' font-weight=\'bold\' fill=\'%2300685f\'>ARAB EXPERTS</text><text x=\'62\' y=\'50\' font-family=\'Arial\' font-size=\'10\' font-weight=\'600\' fill=\'%2364748b\'>INSTITUTE</text></svg>')}" 
                     alt="Arab Experts Institute Logo" />
            </div>

        </div>

        <!-- 6. Bottom Positioned Footer -->
        <div class="page-footer">
            <hr class="footer-divider" />
            <div class="footer-text">
                <span class="cid" th:text="${candidateId}">CAN-98234</span>
                <span> &nbsp;|&nbsp; </span>
                <span class="ar-title" dir="rtl">تقرير الكفاءات للقادة تطوير</span>
            </div>
        </div>
        
        <div class="footer-bottom-accent"></div>
    </div>
</body>
</html>
