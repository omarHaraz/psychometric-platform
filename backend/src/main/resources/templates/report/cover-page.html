<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Cover Page - تقرير الكفاءات للقادة</title>
    <style th:fragment="style">
        /* ==========================================================================
           PDF &amp; Print Optimization (OpenHTMLtoPDF, Flying Saucer compatible)
           ========================================================================== */
        @page {
            size: A4 portrait;
            margin: 0;
        }

        * {
            box-sizing: border-box;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 210mm;
            height: 297mm;
            min-height: 297mm;
            font-family: 'Cairo', 'Amiri', 'DejaVu Sans', 'Arial', 'Tahoma', sans-serif;
            background-color: #ffffff;
            color: #1e293b;
            text-align: center;
        }

        /* Page Container */
        .pdf-page-wrapper, .page-container {
            position: relative;
            width: 210mm;
            height: 297mm;
            min-height: 297mm;
            overflow: hidden;
            background: #ffffff;
            margin: 0 auto;
        }

        /* Top Modern Geometric Accents */
        .top-accent-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: 8px;
            background-color: #1e3a4c;
            z-index: 5;
        }

        .copper-accent-stripe {
            position: absolute;
            top: 8px;
            left: 0;
            right: 0;
            width: 100%;
            height: 4px;
            background-color: #7a4b3a;
            z-index: 5;
        }

        /* Flex / Table Centering Layout */
        .flex-center-container {
            display: block;
            text-align: center;
            width: 100%;
            padding: 38mm 22mm 45mm 22mm;
            position: relative;
            z-index: 2;
        }

        /* 1. Header */
        .header-country {
            font-family: 'Inter', 'Arial', sans-serif;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #475569;
            margin: 0 0 14px 0;
            direction: ltr;
            text-align: center;
        }

        .header-symbol {
            margin: 0 auto 18px auto;
            color: #1e3a4c;
            font-size: 24px;
            line-height: 1;
        }

        .divider-small {
            width: 48px;
            height: 3px;
            background-color: #7a4b3a;
            margin: 0 auto 28px auto;
            border: none;
            border-radius: 2px;
        }

        /* 2. Report Title &amp; Subtitle */
        .report-title-ar {
            font-size: 34px;
            font-weight: 800;
            color: #1e3a4c;
            line-height: 1.35;
            margin: 0 0 8px 0;
            direction: rtl;
            text-align: center;
        }

        .report-subtitle-ar {
            font-size: 22px;
            font-weight: 600;
            color: #7a4b3a;
            margin: 0 0 34px 0;
            direction: rtl;
            text-align: center;
            letter-spacing: 1px;
        }

        /* 3. Candidate &amp; Result Information Box */
        .meta-card {
            width: 400px;
            max-width: 90%;
            margin: 0 auto 32px auto;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-top: 3px solid #1e3a4c;
            border-radius: 6px;
            padding: 18px 24px;
            text-align: center;
        }

        .meta-line {
            font-size: 13px;
            color: #334155;
            margin: 0 0 8px 0;
            line-height: 1.5;
            text-align: center;
        }

        .meta-line.candidate-id {
            font-family: 'Inter', 'Arial', sans-serif;
            font-weight: 600;
            color: #0f172a;
            direction: ltr;
        }

        .meta-line.report-date {
            font-family: 'Inter', 'Arial', sans-serif;
            color: #64748b;
            font-size: 12px;
            direction: ltr;
        }

        .meta-line.result-score {
            font-family: 'Inter', 'Arial', sans-serif;
            font-size: 16px;
            font-weight: 700;
            color: #1e3a4c;
            margin-top: 10px;
            margin-bottom: 0;
            padding-top: 8px;
            border-top: 1px dashed #cbd5e1;
            direction: ltr;
        }

        .meta-line.result-score span {
            font-size: 20px;
            color: #1e3a4c;
        }

        /* 4. Logo Container */
        .logo-container {
            margin: 8px auto 0 auto;
            text-align: center;
            display: block;
        }

        .company-logo {
            max-width: 180px;
            max-height: 70px;
            display: block;
            margin: 0 auto;
        }

        /* 5. Solid Bottom Footer Frame (OpenHTMLtoPDF Display Table structure) */
        .cover-footer {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: 48px;
            background-color: #7a4b3a;
            color: #ffffff;
            display: table;
            z-index: 10;
            box-sizing: border-box;
        }

        .cover-footer-row {
            display: table-row;
            width: 100%;
            height: 48px;
        }

        .cover-footer-cell-left {
            display: table-cell;
            vertical-align: middle;
            text-align: left;
            padding-left: 20mm;
            width: 40%;
        }

        .cover-footer-accent {
            display: inline-block;
            background-color: #1e3a4c;
            color: #ffffff;
            height: 48px;
            line-height: 48px;
            padding: 0 16px;
            font-size: 10px;
            font-weight: 700;
            font-family: 'Inter', 'Arial', sans-serif;
            letter-spacing: 0.5px;
        }

        .cover-footer-cell-right {
            display: table-cell;
            vertical-align: middle;
            text-align: right;
            padding-right: 20mm;
            color: #ffffff;
            font-size: 11px;
            font-weight: 600;
            font-family: 'Inter', 'Arial', sans-serif;
            direction: ltr;
        }

        .banner-subtext {
            position: absolute;
            bottom: 54px;
            right: 20mm;
            font-size: 10px;
            color: #64748b;
            font-family: 'Inter', 'Arial', sans-serif;
            direction: ltr;
            z-index: 5;
        }

        .page-footer-label {
            position: absolute;
            bottom: 54px;
            left: 20mm;
            font-size: 11px;
            color: #64748b;
            direction: rtl;
            z-index: 5;
        }
    </style>
</head>
<body>
    <div th:fragment="body" class="pdf-page-wrapper">
        <!-- Top Accents -->
        <div class="top-accent-bar"></div>
        <div class="copper-accent-stripe"></div>

        <!-- Centered Content Area -->
        <div class="flex-center-container">
            
            <!-- 1. Header -->
            <div class="header-country" dir="ltr">UNITED ARAB EMIRATES</div>
            <div class="header-symbol">❖</div>
            <hr class="divider-small" />

            <!-- 2. Report Title &amp; Subtitle (Arabic RTL) -->
            <h1 class="report-title-ar" dir="rtl">تقرير الكفاءات للقادة</h1>
            <div class="report-subtitle-ar" dir="rtl">تطوير</div>

            <!-- 3. Candidate Info &amp; Result Box (English LTR with variables) -->
            <div class="meta-card">
                <div class="meta-line candidate-id" dir="ltr">
                    candidateID <span th:text="${candidateId}">CAN-98234</span>
                </div>
                <div class="meta-line report-date" dir="ltr">
                    <span th:text="${reportDate}">2026-08-31</span>
                </div>
                <div class="meta-line result-score" dir="ltr">
                    Result: <span th:text="${resultScore}">88.5</span>%
                </div>
            </div>

            <!-- 4. Logo (Base64 data URI / Dynamic Thymeleaf URL) -->
            <div class="logo-container">
                <img th:if="${companyLogoBase64 != null}" 
                     th:src="${companyLogoBase64.startsWith('data:') ? companyLogoBase64 : ('data:image/png;base64,' + companyLogoBase64)}" 
                     alt="Executive Logo" 
                     class="company-logo" />
            </div>

        </div>

        <!-- 5. Footer Metadata Labels -->
        <div class="page-footer-label" dir="rtl">
            <span th:text="${candidateId}">CAN-98234</span> | تقرير الكفاءات للقادة تطوير
        </div>
        <div class="banner-subtext">
            &#169; <span th:text="${#dates != null ? #dates.year(#dates.createNow()) : '2026'}">2026</span> Assessment Platform
        </div>

        <!-- 6. Solid Footer Frame Bar -->
        <div class="cover-footer">
            <div class="cover-footer-row">
                <div class="cover-footer-cell-left">
                    <span class="cover-footer-accent">EXECUTIVE</span>
                </div>
                <div class="cover-footer-cell-right">
                    Executive Leadership Evaluation
                </div>
            </div>
        </div>
    </div>
</body>
</html>
