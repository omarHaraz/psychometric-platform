<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Cover Page - تقرير الكفاءات للقادة</title>
    <style>
        /* ==========================================================================
           PDF &amp; Print Optimization (Flying Saucer, OpenPDF, wkhtmltopdf compatible)
           ========================================================================== */
        @page {
            size: A4 portrait;
            margin: 0;
        }

        * {
            box-sizing: border-box;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 210mm;
            height: 297mm;
            min-height: 297mm;
            font-family: 'Cairo', 'Amiri', 'DejaVu Sans', 'Arial', 'Tahoma', sans-serif;
            background-color: #ffffff;
            color: #1e293b;
            text-align: center;
        }

        /* Page Container */
        .page-container {
            position: relative;
            width: 210mm;
            height: 297mm;
            min-height: 297mm;
            overflow: hidden;
            background: #ffffff;
            margin: 0 auto;
        }

        /* Top Modern Geometric Accents */
        .top-accent-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 8px;
            background: #1e3a4c;
            z-index: 5;
        }

        .copper-accent-stripe {
            position: absolute;
            top: 8px;
            left: 0;
            right: 0;
            height: 4px;
            background: #7a4b3a;
            z-index: 5;
        }

        /* Flexbox Centering Layout */
        .flex-center-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            width: 100%;
            height: 100%;
            min-height: 297mm;
            padding: 35mm 22mm 40mm 22mm;
            position: relative;
            z-index: 2;
        }

        /* 1. Header */
        .header-country {
            font-family: 'Inter', 'Arial', sans-serif;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #475569;
            margin: 0 0 14px 0;
            direction: ltr;
            text-align: center;
        }

        .header-symbol {
            margin: 0 auto 20px auto;
            color: #1e3a4c;
            font-size: 24px;
            line-height: 1;
        }

        .divider-small {
            width: 48px;
            height: 3px;
            background: #7a4b3a;
            margin: 0 auto 30px auto;
            border: none;
            border-radius: 2px;
        }

        /* 2. Report Title &amp; Subtitle */
        .report-title-ar {
            font-size: 34px;
            font-weight: 800;
            color: #1e3a4c;
            line-height: 1.35;
            margin: 0 0 8px 0;
            direction: rtl;
            text-align: center;
        }

        .report-subtitle-ar {
            font-size: 22px;
            font-weight: 600;
            color: #7a4b3a;
            margin: 0 0 38px 0;
            direction: rtl;
            text-align: center;
            letter-spacing: 1px;
        }

        /* 3. Candidate &amp; Result Information Box */
        .meta-card {
            width: 400px;
            max-width: 90%;
            margin: 0 auto 36px auto;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-top: 3px solid #1e3a4c;
            border-radius: 6px;
            padding: 20px 24px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.02);
        }

        .meta-line {
            font-size: 13px;
            color: #334155;
            margin: 0 0 8px 0;
            line-height: 1.5;
            text-align: center;
        }

        .meta-line.candidate-id {
            font-family: 'Inter', 'Arial', sans-serif;
            font-weight: 600;
            color: #0f172a;
            direction: ltr;
        }

        .meta-line.report-date {
            font-family: 'Inter', 'Arial', sans-serif;
            color: #64748b;
            font-size: 12px;
            direction: ltr;
        }

        .meta-line.result-score {
            font-family: 'Inter', 'Arial', sans-serif;
            font-size: 16px;
            font-weight: 700;
            color: #1e3a4c;
            margin-top: 10px;
            margin-bottom: 0;
            padding-top: 8px;
            border-top: 1px dashed #cbd5e1;
            direction: ltr;
        }

        .meta-line.result-score span {
            font-size: 20px;
            color: #1e3a4c;
        }

        /* 4. Logo Container */
        .logo-container {
            margin: 10px auto 0 auto;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .company-logo {
            max-width: 140px;
            max-height: 65px;
            object-fit: contain;
            display: inline-block;
            margin: 0 auto;
        }

        /* 5. Modern Multi-Segment Footer Banner (Matching Page 2 Design) */
        .bottom-banner-wrapper {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: 38px;
            background: #7a4b3a;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20mm;
            box-sizing: border-box;
        }

        .banner-left-shape {
            position: absolute;
            bottom: 0;
            left: 20mm;
            width: 90px;
            height: 38px;
            background: #1e3a4c;
            transform: skew(-25deg);
            z-index: 11;
        }

        .banner-text-right {
            position: relative;
            z-index: 12;
            color: #ffffff;
            font-size: 11px;
            font-weight: 600;
            font-family: 'Inter', 'Arial', sans-serif;
            margin-left: auto;
            direction: ltr;
        }

        .banner-subtext {
            position: absolute;
            bottom: 42px;
            right: 20mm;
            font-size: 10px;
            color: #64748b;
            font-family: 'Inter', 'Arial', sans-serif;
            direction: ltr;
        }

        .page-footer-label {
            position: absolute;
            bottom: 42px;
            left: 20mm;
            font-size: 11px;
            color: #64748b;
            direction: rtl;
        }
    </style>
</head>
<body>
    <div class="page-container">
        <!-- Top Accents -->
        <div class="top-accent-bar"></div>
        <div class="copper-accent-stripe"></div>

        <!-- Flexbox Centered Content -->
        <div class="flex-center-container">
            
            <!-- 1. Header -->
            <div class="header-country" dir="ltr">UNITED ARAB EMIRATES</div>
            <div class="header-symbol">❖</div>
            <hr class="divider-small" />

            <!-- 2. Report Title &amp; Subtitle (Arabic RTL) -->
            <h1 class="report-title-ar" dir="rtl">تقرير الكفاءات للقادة</h1>
            <div class="report-subtitle-ar" dir="rtl">تطوير</div>

            <!-- 3. Candidate Info &amp; Result Box (English LTR with variables) -->
            <div class="meta-card">
                <div class="meta-line candidate-id" dir="ltr">
                    candidateID <span th:text="${candidateId}">CAN-98234</span>
                </div>
                <div class="meta-line report-date" dir="ltr">
                    <span th:text="${reportDate}">2026-08-31</span>
                </div>
                <div class="meta-line result-score" dir="ltr">
                    Result: <span th:text="${resultScore}">88.5</span>%
                </div>
            </div>

            <!-- 4. Logo (Base64 data URI / Dynamic Thymeleaf URL / Fallback SVG) -->
            <div class="logo-container">
                <img class="company-logo" 
                     th:src="${companyLogoBase64 != null ? companyLogoBase64 : (logoUrl != null ? logoUrl : '')}" 
                     alt="Executive Logo" />
            </div>

        </div>

        <!-- 5. Footer -->
        <div class="page-footer-label" dir="rtl">
            <span th:text="${candidateId}">CAN-98234</span> | تقرير الكفاءات للقادة تطوير
        </div>
        <div class="banner-subtext">
            &#169; <span th:text="${#dates != null ? #dates.year(#dates.createNow()) : '2026'}">2026</span> Assessment Platform
        </div>

        <div class="bottom-banner-wrapper">
            <div class="banner-left-shape"></div>
            <div class="banner-text-right">Executive Leadership Evaluation</div>
        </div>
    </div>
</body>
</html>
