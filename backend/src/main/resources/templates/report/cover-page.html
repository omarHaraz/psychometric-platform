<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Cover Page - تقرير الكفاءات للقادة</title>
    <style>
        /* ==========================================================================
           PDF & Print Optimization (Flying Saucer, OpenPDF, wkhtmltopdf compatible)
           ========================================================================== */
        @page {
            size: A4 portrait;
            margin: 0;
        }

        * {
            box-sizing: border-box;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 210mm;
            height: 297mm;
            font-family: 'Cairo', 'Amiri', 'DejaVu Sans', 'Arial', 'Tahoma', sans-serif;
            background-color: #ffffff;
            color: #1e293b;
        }

        /* Page Container */
        .page-container {
            position: relative;
            width: 210mm;
            height: 297mm;
            overflow: hidden;
            background: #ffffff;
        }

        /* Decorative Background Elements */
        .top-accent-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 12px;
            background: #00685f;
        }

        .gold-accent-stripe {
            position: absolute;
            top: 12px;
            left: 0;
            right: 0;
            height: 4px;
            background: #c5a059;
        }

        .geometric-accent-left {
            position: absolute;
            top: 0;
            left: 0;
            width: 140px;
            height: 140px;
            background: linear-gradient(135deg, rgba(0, 104, 95, 0.08) 0%, rgba(197, 160, 89, 0.03) 100%);
            border-bottom-right-radius: 100%;
        }

        .geometric-accent-right {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 180px;
            height: 180px;
            background: linear-gradient(315deg, rgba(0, 104, 95, 0.07) 0%, rgba(197, 160, 89, 0.04) 100%);
            border-top-left-radius: 100%;
        }

        /* Centered Layout Wrapper */
        .content-table {
            width: 100%;
            height: 100%;
            border-collapse: collapse;
            text-align: center;
        }

        .content-cell {
            vertical-align: middle;
            padding: 45mm 20mm 35mm 20mm;
        }

        /* 1. Header */
        .header-country {
            font-family: 'Inter', 'Arial', sans-serif;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: #475569;
            margin-bottom: 28px;
            direction: ltr;
            unicode-bidi: bidi-override;
        }

        .divider-small {
            width: 60px;
            height: 3px;
            background: #c5a059;
            margin: 0 auto 35px auto;
            border: none;
        }

        /* 2. Report Title & Subtitle */
        .report-title-ar {
            font-size: 34px;
            font-weight: 800;
            color: #00685f;
            line-height: 1.35;
            margin: 0 0 12px 0;
            direction: rtl;
        }

        .report-subtitle-ar {
            font-size: 24px;
            font-weight: 600;
            color: #c5a059;
            margin: 0 0 45px 0;
            direction: rtl;
            letter-spacing: 1px;
        }

        /* 3. Candidate & Result Information Box */
        .meta-card {
            width: 82%;
            max-width: 460px;
            margin: 0 auto 40px auto;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-top: 3px solid #00685f;
            border-radius: 8px;
            padding: 22px 26px;
            text-align: center;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
        }

        .meta-line {
            font-size: 14px;
            color: #334155;
            margin-bottom: 10px;
            line-height: 1.6;
        }

        .meta-line.candidate-id {
            font-family: 'Inter', 'Arial', sans-serif;
            font-weight: 600;
            color: #0f172a;
            direction: ltr;
            unicode-bidi: embed;
        }

        .meta-line.report-date {
            font-family: 'Inter', 'Arial', sans-serif;
            color: #64748b;
            font-size: 13px;
            direction: ltr;
            unicode-bidi: embed;
        }

        .meta-line.result-score {
            font-family: 'Inter', 'Arial', sans-serif;
            font-size: 18px;
            font-weight: 700;
            color: #00685f;
            margin-top: 12px;
            margin-bottom: 0;
            padding-top: 10px;
            border-top: 1px dashed #cbd5e1;
            direction: ltr;
            unicode-bidi: embed;
        }

        .meta-line.result-score span {
            font-size: 22px;
            color: #00685f;
        }

        /* 4. Company Name Section */
        .company-block {
            margin-top: 20px;
            margin-bottom: 28px;
        }

        .company-name-ar {
            font-size: 17px;
            font-weight: 700;
            color: #0f172a;
            line-height: 1.5;
            direction: rtl;
            margin: 0;
        }

        .company-sub-ar {
            font-size: 14px;
            font-weight: 600;
            color: #64748b;
            direction: rtl;
            margin: 2px 0 10px 0;
        }

        .company-name-en {
            font-family: 'Inter', 'Arial', sans-serif;
            font-size: 14px;
            font-weight: 700;
            color: #0f172a;
            direction: ltr;
            margin: 0;
            letter-spacing: 0.5px;
        }

        .company-sub-en {
            font-family: 'Inter', 'Arial', sans-serif;
            font-size: 12px;
            font-weight: 500;
            color: #64748b;
            direction: ltr;
            margin: 2px 0 0 0;
        }

        /* 5. Logo */
        .logo-container {
            margin: 15px auto 0 auto;
            text-align: center;
        }

        .company-logo {
            max-width: 130px;
            max-height: 70px;
            object-fit: contain;
            display: inline-block;
        }

        /* 6. Footer */
        .page-footer {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 24mm;
            border-top: 1px solid #e2e8f0;
            background: #ffffff;
            text-align: center;
            padding-top: 7mm;
        }

        .footer-bottom-accent {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: #00685f;
        }

        .footer-text {
            font-size: 11px;
            color: #64748b;
            line-height: 1.4;
            direction: rtl;
            unicode-bidi: embed;
        }

        .footer-text .cid {
            font-family: 'Inter', 'Arial', sans-serif;
            font-weight: 600;
            color: #334155;
            direction: ltr;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="page-container">
        <!-- Top Accents -->
        <div class="top-accent-bar"></div>
        <div class="gold-accent-stripe"></div>
        <div class="geometric-accent-left"></div>
        <div class="geometric-accent-right"></div>

        <!-- Vertical & Horizontal Centering Table -->
        <table class="content-table">
            <tr>
                <td class="content-cell">
                    
                    <!-- 1. Header -->
                    <div class="header-country" dir="ltr">UNITED ARAB EMIRATES</div>
                    <hr class="divider-small" />

                    <!-- 2. Report Title & Subtitle -->
                    <h1 class="report-title-ar" dir="rtl">تقرير الكفاءات للقادة</h1>
                    <div class="report-subtitle-ar" dir="rtl">تطوير</div>

                    <!-- 3. Candidate Info & Result Box -->
                    <div class="meta-card">
                        <div class="meta-line candidate-id" dir="ltr">
                            candidateID <span th:text="${candidateId}">CAN-98234</span>
                        </div>
                        <div class="meta-line report-date" dir="ltr">
                            <span th:text="${reportDate}">2026-08-31</span>
                        </div>
                        <div class="meta-line result-score" dir="ltr">
                            Result: <span th:text="${resultScore}">88.5</span>%
                        </div>
                    </div>

                    <!-- 4. Company Name (Arabic & English) -->
                    <div class="company-block">
                        <div class="company-name-ar" dir="rtl">معهد الخبراء العرب</div>
                        <div class="company-sub-ar" dir="rtl">للتدريب والاستشارات</div>
                        <div class="company-name-en" dir="ltr">Arab Experts Institute</div>
                        <div class="company-sub-en" dir="ltr">For Training &amp; Consultation</div>
                    </div>

                    <!-- 5. Logo -->
                    <div class="logo-container">
                        <img class="company-logo" th:src="@{/images/logo.png}" alt="Arab Experts Institute Logo" />
                    </div>

                </td>
            </tr>
        </table>

        <!-- 6. Footer -->
        <div class="page-footer">
            <div class="footer-text">
                <span class="cid" th:text="${candidateId}">CAN-98234</span> | تقرير الكفاءات للقادة تطوير
            </div>
            <div class="footer-bottom-accent"></div>
        </div>
    </div>
</body>
</html>
