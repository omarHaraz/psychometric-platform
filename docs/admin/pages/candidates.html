<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Candidates | Arab Experts Institute</title>
  <link rel="icon" type="image/webp" href="../assets/img/favicon.webp">

  <!-- Fonts -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0">

  <!-- Styles -->
  <link rel="stylesheet" href="../assets/css/nucleo-icons.css">
  <link rel="stylesheet" href="../assets/css/nucleo-svg.css">
  <link rel="stylesheet" href="../assets/css/material-dashboard.css?v=3.2.0">
  <link rel="stylesheet" href="../assets/css/dashboard-responsive.css">
  
  <style>
    .main-content {
      margin-left: 17rem;
      transition: all .3s ease;
    }

    @media (max-width:1200px) {
      .main-content {
        margin-left: 0;
      }
    }
  </style>

</head>

<body class="g-sidenav-show bg-gray-100">

  <!-- Sidebar -->
  <div id="sidebar"></div>

  <!-- Main Content -->
  <main class="main-content position-relative max-height-vh-100 h-100 border-radius-lg">

    <!-- Navbar -->
    <div id="navbar"></div>

    <!-- Page Content -->
    <div class="container-fluid py-4">

      <div class="row">
        <div class="col-12">

          <div class="card">

            <div class="card-header pb-0">

              <div class="d-flex justify-content-between align-items-center">

                <div>
                  <h5 class="mb-1">Candidates</h5>
                  <p class="text-sm mb-0">
                    Manage registered candidate accounts.
                  </p>
                </div>

                <button
                  class="btn bg-gradient-dark mb-0"
                  id="addCandidateBtn"
                  onclick="openCreateModal()">
                  <i class="material-symbols-rounded text-sm">add</i>
                  &nbsp;Add Candidate
                </button>

              </div>

            </div>

            <div class="card-body px-0 pb-2">

              <div class="table-responsive">

                <table class="table align-items-center mb-0">

                  <thead>

                    <tr>

                      <th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">
                        Name
                      </th>

                      <th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7 ps-2">
                        Email
                      </th>

                      <th class="text-center text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">
                        Account
                      </th>

                      <th class="text-center text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">
                        Assessment Status
                      </th>

                      <th class="text-center text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">
                        Actions
                      </th>

                    </tr>

                  </thead>

                  <tbody id="candidates-table-body">
                    <!-- Loaded by JavaScript -->
                  </tbody>

                </table>

              </div>

            </div>

          </div>

        </div>
      </div>

    </div>

  </main>

  <!-- Candidate Modal -->
  <div class="modal fade"
       id="candidateModal"
       tabindex="-1"
       aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered">

      <div class="modal-content">

        <div class="modal-header">

          <h5 class="modal-title" id="candidateModalLabel">
            Edit Candidate
          </h5>

          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
            aria-label="Close">
          </button>

        </div>

        <div class="modal-body">

          <form id="candidateForm">

            <input type="hidden" id="candidateId">

            <div class="mb-3">
              <label class="form-label text-xs font-weight-bold text-dark ms-1 mb-1">
                Full Name
              </label>
              <div class="input-group input-group-outline">
                <input
                  type="text"
                  class="form-control px-3"
                  id="candidateName"
                  placeholder="e.g. Jane Smith"
                  required>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label text-xs font-weight-bold text-dark ms-1 mb-1">
                Email Address
              </label>
              <div class="input-group input-group-outline">
                <input
                  type="email"
                  class="form-control px-3"
                  id="candidateEmail"
                  placeholder="candidate@arabexperts.com"
                  required>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label text-xs font-weight-bold text-dark ms-1 mb-1">
                Password
              </label>
              <div class="input-group input-group-outline">
                <input
                  type="password"
                  class="form-control px-3"
                  id="candidatePassword"
                  placeholder="••••••••">
              </div>
              <small
                id="passwordHelp"
                class="text-muted text-xs ms-1 mt-1 d-none">
                Leave blank to keep existing password.
              </small>
            </div>

            <div class="text-end">

              <button
                type="button"
                class="btn btn-light"
                data-bs-dismiss="modal">
                Cancel
              </button>

              <button
                type="submit"
                class="btn bg-gradient-dark">
                Save
              </button>

            </div>

          </form>

        </div>

      </div>

    </div>

  </div>

  <!-- Assign Assessment Modal -->
  <div class="modal fade" id="assignAssessmentModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg">
        <div class="modal-header bg-gradient-dark text-white">
          <h5 class="modal-title text-white d-flex align-items-center">
            <i class="material-symbols-rounded text-sm me-2">assignment_add</i>
            <span>Assign Assessment to Candidate</span>
          </h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body p-4">
          <p class="text-sm text-secondary mb-3">
            Candidate: <strong id="assignCandidateName" class="text-dark"></strong>
          </p>
          <input type="hidden" id="assignCandidateId">
          
          <label class="form-label text-xs font-weight-bold text-dark text-uppercase tracking-wider mb-2">
            Select Exam Type (اختر نوع الاختبار المراد تعيينه):
          </label>
          <div class="d-flex flex-column gap-2 mb-3">
            <label class="card border p-3 cursor-pointer exam-assign-card active mb-0" id="cardPsychometric" style="border-width: 2px !important; border-color: #344767 !important; background-color: #f8f9fa;">
              <div class="d-flex align-items-center justify-content-between">
                <div>
                  <h6 class="mb-1 font-weight-bold text-dark d-flex align-items-center">
                    <i class="material-symbols-rounded text-info text-sm me-2">psychology</i>
                    التقييم السيكومتري القيادي (Psychometric Assessment)
                  </h6>
                  <small class="text-xxs text-secondary">4 Batteries (PQ10, SJT, Derailers, GCAT) - Leadership Track</small>
                </div>
                <input class="form-check-input ms-2" type="radio" name="assignExamRadio" id="radioPsychometric" value="PSYCHOMETRIC" checked>
              </div>
            </label>

            <label class="card border p-3 cursor-pointer exam-assign-card mb-0" id="cardEmployment" style="border-width: 2px !important; border-color: #e9ecef;">
              <div class="d-flex align-items-center justify-content-between">
                <div>
                  <h6 class="mb-1 font-weight-bold text-dark d-flex align-items-center">
                    <i class="material-symbols-rounded text-success text-sm me-2">work</i>
                    اختبار التوظيف (Employment Assessment)
                  </h6>
                  <small class="text-xxs text-secondary">3 Batteries (PQ10, SJT, GCAT) - Hiring Track (No Derailers)</small>
                </div>
                <input class="form-check-input ms-2" type="radio" name="assignExamRadio" id="radioEmployment" value="EMPLOYMENT">
              </div>
            </label>
          </div>
        </div>
        <div class="modal-footer border-0 pt-0">
          <button type="button" class="btn btn-outline-secondary btn-sm mb-0" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn bg-gradient-primary btn-sm shadow-sm mb-0" id="confirmAssignExamBtn">
            <i class="material-symbols-rounded text-xs me-1">check_circle</i>
            Assign Assessment
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Score Breakdown Modal -->
  <div class="modal fade" id="adminScoreModal" tabindex="-1" aria-labelledby="adminScoreModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header bg-gradient-dark text-white">
          <h5 class="modal-title text-white" id="adminScoreModalLabel">Candidate Assessment Report</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body p-4" id="adminScoreModalBody">
          <!-- Populated dynamically via candidate-management.js -->
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          <button type="button" class="btn bg-gradient-primary" id="adminPrintReportBtn">Print / PDF Report</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Core JS -->
  <script src="../assets/js/core/popper.min.js"></script>
  <script src="../assets/js/core/bootstrap.min.js"></script>
  <script src="../assets/js/plugins/perfect-scrollbar.min.js"></script>

  <!-- Shared Components -->
  <script src="../assets/js/loadComponents.js"></script>

  <script src="../assets/js/dashboard-responsive.js"></script>

  <!-- Admin UI Helpers -->
  <script src="../assets/js/admin-ui.js"></script>

  <!-- Candidate Page -->
  <script type="module" src="../assets/js/dashboard/candidate-management.js"></script>

</body>

</html>
