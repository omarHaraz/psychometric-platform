<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Arab Experts Institute - Assessment Portal Login</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#00685f",
                        "primary-container": "#008378",
                        "on-primary": "#ffffff",
                        "on-primary-container": "#f4fffc",
                        "surface": "#faf8ff",
                        "surface-dim": "#d2d9f4",
                        "surface-container": "#eaedff",
                        "surface-container-low": "#f2f3ff",
                        "surface-container-high": "#e2e7ff",
                        "surface-container-highest": "#dae2fd",
                        "on-surface": "#131b2e",
                        "on-surface-variant": "#3d4947",
                        "secondary": "#515f74",
                        "secondary-container": "#d5e3fd",
                        "on-secondary-container": "#57657b",
                        "outline": "#6d7a77",
                        "outline-variant": "#bcc9c6",
                        "error": "#ba1a1a",
                        "error-container": "#ffdad6"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.375rem",
                        "xl": "0.5rem",
                        "full": "9999px"
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F8FAFC; }
        .input-field:focus { border-color: #00685f; box-shadow: 0 0 0 1px #00685f; outline: none; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 md:p-8 text-on-surface">
<main class="w-full max-w-[440px] mx-auto flex flex-col items-center">
    
    <!-- Header / Logo Area -->
    <div class="mb-6 flex flex-col items-center text-center w-full">
        <a href="../index.html">
            <img alt="Arab Experts Institute Logo" class="h-20 object-contain mb-4" src="assets/images/logo.png">
        </a>
        <h1 class="text-2xl font-semibold text-on-surface tracking-tight">Assessment Portal</h1>
        <p class="text-sm text-on-surface-variant mt-1">Secure Candidate & Evaluator Login</p>
    </div>

    <!-- Login Card -->
    <div class="bg-white w-full rounded-2xl border border-slate-200 p-6 md:p-8 shadow-sm">
        <!-- Error Message Container -->
        <div id="loginErrorMsg" class="hidden bg-red-50 border border-red-200 text-red-700 text-xs font-bold px-4 py-3 rounded-lg mb-4 text-center" dir="rtl">
            البريد الإلكتروني أو كلمة المرور غير صحيحة.
        </div>

        <form id="loginForm" novalidate class="space-y-5">
            <div id="formError" class="p-3 bg-red-50 border border-red-200 text-red-700 text-xs rounded-lg hidden" role="alert"></div>

            <!-- Email Field -->
            <div>
                <label class="block text-xs font-semibold text-on-surface mb-2" for="email">Email Address / البريد الإلكتروني</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                        <span class="material-symbols-outlined text-[20px]">person</span>
                    </div>
                    <input class="input-field block w-full pl-10 pr-3 py-2.5 border border-slate-300 rounded-lg bg-white text-on-surface text-sm placeholder-slate-400" id="email" name="email" placeholder="name@example.com" required type="email">
                </div>
                <span class="text-[11px] text-red-500 mt-1 block" id="emailError"></span>
            </div>

            <!-- Password Field -->
            <div>
                <div class="flex justify-between items-center mb-2">
                    <label class="block text-xs font-semibold text-on-surface" for="password">Password</label>
                    <a class="text-xs font-medium text-primary hover:text-primary-container transition-colors" href="forgot-password.html">Forgot Password?</a>
                </div>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                        <span class="material-symbols-outlined text-[20px]">lock</span>
                    </div>
                    <input class="input-field block w-full pl-10 pr-10 py-2.5 border border-slate-300 rounded-lg bg-white text-on-surface text-sm placeholder-slate-400" id="password" name="password" placeholder="••••••••" required type="password">
                    <button class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 focus:outline-none" type="button" id="togglePassword">
                        <span class="material-symbols-outlined text-[20px]">visibility</span>
                    </button>
                </div>
                <span class="text-[11px] text-red-500 mt-1 block" id="passwordError"></span>
            </div>

            <!-- Login Button -->
            <button id="loginBtn" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg bg-primary text-white text-sm font-semibold hover:bg-primary-container focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors shadow-sm mt-6" type="submit">
                Sign In
            </button>
        </form>
    </div>

    <!-- Footer Security Note -->
    <div class="mt-10 flex items-center justify-center space-x-2 text-on-surface-variant opacity-60">
        <span class="material-symbols-outlined text-[16px]">shield</span>
        <span class="text-xs font-medium">Secure Institutional Gateway</span>
    </div>
</main>

<script type="module" src="js/login.js"></script>
</body>
</html>
