<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Arab Experts Institute - Candidate Registration</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#00685f",
                        "primary-container": "#008378",
                        "on-primary": "#ffffff",
                        "on-primary-container": "#f4fffc",
                        "surface": "#faf8ff",
                        "surface-dim": "#d2d9f4",
                        "surface-container": "#eaedff",
                        "surface-container-low": "#f2f3ff",
                        "surface-container-high": "#e2e7ff",
                        "surface-container-highest": "#dae2fd",
                        "on-surface": "#131b2e",
                        "on-surface-variant": "#3d4947",
                        "secondary": "#515f74",
                        "secondary-container": "#d5e3fd",
                        "on-secondary-container": "#57657b",
                        "outline": "#6d7a77",
                        "outline-variant": "#bcc9c6",
                        "error": "#ba1a1a",
                        "error-container": "#ffdad6"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.375rem",
                        "xl": "0.5rem",
                        "full": "9999px"
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F8FAFC; }
        .input-field:focus { border-color: #00685f; box-shadow: 0 0 0 1px #00685f; outline: none; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 md:p-8 text-on-surface">
<main class="w-full max-w-[460px] mx-auto flex flex-col items-center">
    
    <!-- Header / Logo Area -->
    <div class="mb-6 flex flex-col items-center text-center w-full">
        <a href="../index.html">
            <img alt="Arab Experts Institute Logo" class="h-20 object-contain mb-4" src="assets/images/logo.png">
        </a>
        <h1 class="text-2xl font-semibold text-on-surface tracking-tight">Create Account</h1>
        <p class="text-sm text-on-surface-variant mt-1">Register for Psychometric Evaluation Portal</p>
    </div>

    <!-- Signup Card Container -->
    <div id="signupCard" class="bg-white w-full rounded-2xl border border-slate-200 p-6 md:p-8 shadow-sm">
        
        <!-- Step 1: Signup Form -->
        <form id="signupForm" novalidate class="space-y-4">
            <div id="formError" class="p-3 bg-red-50 border border-red-200 text-red-700 text-xs rounded-lg hidden" role="alert"></div>

            <!-- Full Name -->
            <div>
                <label class="block text-xs font-semibold text-on-surface mb-1.5" for="name">Full Name *</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                        <span class="material-symbols-outlined text-[20px]">badge</span>
                    </div>
                    <input class="input-field block w-full pl-10 pr-3 py-2.5 border border-slate-300 rounded-lg bg-white text-on-surface text-sm placeholder-slate-400" id="name" name="name" placeholder="Dr. Sarah Al-Otaibi" required type="text">
                </div>
                <span class="text-[11px] text-red-500 mt-1 block" id="nameError"></span>
            </div>

            <!-- Email Field -->
            <div>
                <label class="block text-xs font-semibold text-on-surface mb-1.5" for="email">Official Email Address *</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                        <span class="material-symbols-outlined text-[20px]">mail</span>
                    </div>
                    <input class="input-field block w-full pl-10 pr-3 py-2.5 border border-slate-300 rounded-lg bg-white text-on-surface text-sm placeholder-slate-400" id="email" name="email" placeholder="sarah@organization.sa" required type="email">
                </div>
                <span class="text-[11px] text-red-500 mt-1 block" id="emailError"></span>
            </div>

            <!-- Password Field -->
            <div>
                <label class="block text-xs font-semibold text-on-surface mb-1.5" for="password">Password *</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                        <span class="material-symbols-outlined text-[20px]">lock</span>
                    </div>
                    <input class="input-field block w-full pl-10 pr-10 py-2.5 border border-slate-300 rounded-lg bg-white text-on-surface text-sm placeholder-slate-400" id="password" name="password" placeholder="••••••••" required type="password">
                    <button class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 focus:outline-none" type="button" id="togglePassword">
                        <span class="material-symbols-outlined text-[20px]">visibility</span>
                    </button>
                </div>
                <span class="text-[11px] text-red-500 mt-1 block" id="passwordError"></span>
            </div>

            <!-- Submit Button -->
            <button id="submitBtn" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg bg-primary text-white text-sm font-semibold hover:bg-primary-container focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors shadow-sm mt-6" type="submit">
                Continue with Verification
            </button>
        </form>

        <!-- Step 2: OTP Verification Container (Hidden by default) -->
        <div id="otpSection" class="hidden space-y-5">
            <div class="text-center">
                <div class="w-12 h-12 rounded-full bg-emerald-50 text-primary flex items-center justify-center mx-auto mb-3">
                    <span class="material-symbols-outlined text-2xl">mark_email_read</span>
                </div>
                <h2 class="text-lg font-semibold text-on-surface">Verify Email OTP</h2>
                <p class="text-xs text-on-surface-variant mt-1">We sent a 6-digit verification code to <br><span id="targetEmail" class="font-semibold text-primary"></span></p>
            </div>

            <div id="otpError" class="p-3 bg-red-50 border border-red-200 text-red-700 text-xs rounded-lg hidden" role="alert"></div>

            <div class="flex justify-center gap-2" id="otpInputs">
                <input type="text" maxlength="1" class="otp-box w-11 h-12 text-center text-lg font-bold border border-slate-300 rounded-lg focus:border-primary focus:ring-1 focus:ring-primary outline-none" />
                <input type="text" maxlength="1" class="otp-box w-11 h-12 text-center text-lg font-bold border border-slate-300 rounded-lg focus:border-primary focus:ring-1 focus:ring-primary outline-none" />
                <input type="text" maxlength="1" class="otp-box w-11 h-12 text-center text-lg font-bold border border-slate-300 rounded-lg focus:border-primary focus:ring-1 focus:ring-primary outline-none" />
                <input type="text" maxlength="1" class="otp-box w-11 h-12 text-center text-lg font-bold border border-slate-300 rounded-lg focus:border-primary focus:ring-1 focus:ring-primary outline-none" />
                <input type="text" maxlength="1" class="otp-box w-11 h-12 text-center text-lg font-bold border border-slate-300 rounded-lg focus:border-primary focus:ring-1 focus:ring-primary outline-none" />
                <input type="text" maxlength="1" class="otp-box w-11 h-12 text-center text-lg font-bold border border-slate-300 rounded-lg focus:border-primary focus:ring-1 focus:ring-primary outline-none" />
            </div>

            <button id="verifyOtpBtn" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg bg-primary text-white text-sm font-semibold hover:bg-primary-container focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors shadow-sm" type="button">
                Verify & Activate Account
            </button>

            <div class="flex justify-between items-center text-xs text-on-surface-variant pt-2">
                <button type="button" id="resendBtn" class="text-primary font-semibold hover:underline">Resend Code</button>
                <span id="countdownTimer" class="text-slate-400">01:00</span>
            </div>
        </div>

    </div>

    <!-- Login Link -->
    <div class="mt-6 text-center">
        <p class="text-sm text-on-surface-variant">
            Already have an account? 
            <a class="text-sm text-primary hover:text-primary-container font-semibold transition-colors ml-1" href="login.html">Sign In</a>
        </p>
    </div>

    <!-- Footer Security Note -->
    <div class="mt-8 flex items-center justify-center space-x-2 text-on-surface-variant opacity-60">
        <span class="material-symbols-outlined text-[16px]">verified_user</span>
        <span class="text-xs font-medium">Arab Experts Institute &bull; ISO-27001 Certified System</span>
    </div>
</main>

<script type="module" src="js/signup.js"></script>
</body>
</html>
