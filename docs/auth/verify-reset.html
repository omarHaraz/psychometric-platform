<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Reset Code | Arab Experts Institute</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />

    <style>
        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
        }
        .font-display { font-family: 'Cairo', 'Plus Jakarta Sans', sans-serif; }
        .font-mono-label { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; letter-spacing: 0.04em; }
    </style>
</head>

<body class="min-h-screen flex flex-col justify-between selection:bg-[#1b3879]/20">

    <!-- Top Header -->
    <header class="w-full px-6 py-5 flex justify-between items-center max-w-[1440px] mx-auto">
        <a href="../index.html" class="flex items-center gap-3">
            <img src="assets/images/logo.png" alt="Arab Experts Institute For Training & Consultation" class="h-10 md:h-12 w-auto object-contain" />
        </a>
        <a href="../index.html" class="font-body text-xs font-semibold text-[#1b3879] hover:underline flex items-center gap-1">
            <span>Home Portal</span>
            <span class="material-symbols-outlined text-sm">arrow_forward</span>
        </a>
    </header>

    <!-- Center Card -->
    <main class="flex-grow flex items-center justify-center p-6">
        <div class="w-full max-w-md bg-white rounded-3xl p-8 md:p-10 shadow-2xl border border-slate-200/80 space-y-6">
            <div class="text-center space-y-2">
                <div class="w-12 h-12 rounded-full bg-[#1b3879]/10 text-[#1b3879] flex items-center justify-center mx-auto mb-3">
                    <span class="material-symbols-outlined text-2xl">verified_user</span>
                </div>
                <span class="font-mono-label text-[11px] uppercase tracking-widest text-[#1b3879] font-bold">Verification Code</span>
                <h1 class="font-display font-extrabold text-3xl text-[#1c1c19]">Email Verification</h1>
                <p class="font-body text-xs text-[#64748b]">We sent a verification code to <strong id="displayEmail" class="text-[#1c1c19]"></strong></p>
            </div>

            <span id="otpError" class="text-[11px] text-red-500 font-mono-label text-center block"></span>

            <div class="flex justify-center gap-2 py-2">
                <input type="text" maxlength="1" class="otp-input w-10 h-12 text-center text-lg font-bold border border-slate-300 rounded-xl outline-none focus:border-[#1b3879]" inputmode="numeric" />
                <input type="text" maxlength="1" class="otp-input w-10 h-12 text-center text-lg font-bold border border-slate-300 rounded-xl outline-none focus:border-[#1b3879]" inputmode="numeric" />
                <input type="text" maxlength="1" class="otp-input w-10 h-12 text-center text-lg font-bold border border-slate-300 rounded-xl outline-none focus:border-[#1b3879]" inputmode="numeric" />
                <input type="text" maxlength="1" class="otp-input w-10 h-12 text-center text-lg font-bold border border-slate-300 rounded-xl outline-none focus:border-[#1b3879]" inputmode="numeric" />
                <input type="text" maxlength="1" class="otp-input w-10 h-12 text-center text-lg font-bold border border-slate-300 rounded-xl outline-none focus:border-[#1b3879]" inputmode="numeric" />
                <input type="text" maxlength="1" class="otp-input w-10 h-12 text-center text-lg font-bold border border-slate-300 rounded-xl outline-none focus:border-[#1b3879]" inputmode="numeric" />
            </div>

            <button id="verifyBtn" type="button" class="w-full bg-[#1b3879] hover:bg-[#152c61] text-white py-3.5 rounded-xl font-body font-semibold text-sm shadow-xl hover:shadow-2xl transition-all">
                Verify Code
            </button>

            <button id="resendBtn" type="button" class="w-full bg-[#f1f5f9] hover:bg-[#e2e8f0] text-[#1c1c19] py-3 rounded-xl font-body text-xs font-semibold">
                Resend Code
            </button>

            <div class="text-center pt-2 border-t border-slate-100">
                <p class="text-xs text-[#64748b]">
                    Wrong email?
                    <a href="forgot-password.html" class="text-[#1b3879] font-bold hover:underline">Change Email</a>
                </p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-4 text-center text-xs text-[#64748b] font-mono-label">
        &copy; 2026 Arab Experts Institute For Training & Consultation. All rights reserved.
    </footer>

    <script type="module" src="js/verify-reset.js"></script>
</body>
</html>
